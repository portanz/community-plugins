# OCR — grab text from the screen. Click the bar widget (or control-center
# shortcut) to select a region with slurp, capture it with grim, run tesseract
# over it, and copy the recognized text to the clipboard.
#
# Click mapping (widget): left = OCR a selected region, right = OCR the whole
# focused output. The shortcut mirrors both. A compositor keybind can trigger
# the same actions directly via:
#   noctalia msg plugin fel/ocr:service all region
#   noctalia msg plugin fel/ocr:service all screen
#
# The actual capture pipeline lives in the [[service]] entry below, so it
# keeps working whether or not the bar widget or shortcut is placed anywhere
# — the widget and shortcut are thin clients that dispatch to it.
#
# Settings are plugin-level ([[setting]] at the root): one set shared by all
# three entries, edited from Settings → Plugins.

id = "fel/ocr"
name = "OCR"
version = "1.0.4"
plugin_api = 3
author = "Fel"
license = "MIT"
dependencies = ["grim", "slurp", "tesseract"]
tags = ["utility", "productivity"]
icon = "scan"
description = "Select a screen region and copy its text via tesseract OCR."

[[setting]]
key = "languages"
type = "string"
label_key = "settings.languages.label"
description_key = "settings.languages.description"
default = "eng"

[[setting]]
key = "psm"
type = "select"
label_key = "settings.psm.label"
description_key = "settings.psm.description"
default = "6"
options = [
  { value = "3", label_key = "settings.psm.options.auto" },
  { value = "6", label_key = "settings.psm.options.block" },
  { value = "7", label_key = "settings.psm.options.line" },
]

[[setting]]
key = "copy_to_clipboard"
type = "bool"
label_key = "settings.copy_to_clipboard.label"
default = true

[[setting]]
key = "show_notification"
type = "bool"
label_key = "settings.show_notification.label"
description_key = "settings.show_notification.description"
default = true

# Headless service: owns the real capture pipeline (slurp/grim/tesseract) and
# runs for the whole session as soon as the plugin is enabled, independent of
# whether the widget or shortcut below are placed. Address it with `all` in
# IPC, since it's a singleton with no output of its own.
[[service]]
id = "service"
entry = "service.luau"

# Bar tile: left click = OCR region, right click = OCR focused output.
# Thin client — dispatches to the service above.
[[widget]]
id = "ocr"
entry = "ocr.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "scan"

# Control-center quick tile mirroring the widget's click mapping.
# Thin client — dispatches to the service above.
[[shortcut]]
id = "grab"
entry = "shortcut.luau"
